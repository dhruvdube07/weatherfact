<div id="cmd-root" style="width: 100%; min-height: 820px; background: #000; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; overflow: hidden; border-radius: 40px; position: relative;">

    <div style="width: 97%; height: 95%; min-height: 780px; position: relative; border-radius: 50px; background: #0a0a0a; border: 1px solid rgba(0, 255, 170, 0.2); overflow: hidden; box-shadow: 0 40px 150px rgba(0,0,0,1);">
        
        <div id="map-target" style="width: 100%; height: 100%; position: absolute; filter: contrast(1.1) brightness(0.7) saturate(1.2);"></div>

        <div id="ui-overlay" style="position: absolute; inset: 0; pointer-events: none; padding: 4%; display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at center, transparent, rgba(0,0,0,0.4));">
            
            <div style="display: flex; justify-content: space-between; align-items: flex-start; pointer-events: auto; flex-wrap: wrap; gap: 15px;">
                <div class="glass-pill-ultra">
                    <span class="radar-dot"></span>
                    <div style="display: flex; flex-direction: column;">
                        <span class="bold-label">SATELLITE_UPLINK</span>
                        <span id="loc-name" style="font-weight: 900; color: #00ffaa; font-size: clamp(18px, 4vw, 24px); letter-spacing: 2px; text-shadow: 0 0 15px rgba(0,255,170,0.4);">LOCATING...</span>
                    </div>
                </div>
                <div class="glass-pill-ultra mono" style="text-align: right;">
                    <div style="display: flex; flex-direction: column;">
                        <span class="bold-label">COORD_STAMP</span>
                        <span id="coord-val" style="color: #fff; font-size: clamp(14px, 3vw, 18px); font-weight: 600;">19.4167 / 72.8167</span>
                    </div>
                </div>
            </div>

            <div id="data-grid" style="display: flex; gap: 20px; align-items: flex-end; pointer-events: auto;">
                
                <div class="pro-panel-heavy" style="flex: 1.3;">
                    <span class="bold-label">THERMAL_DATA</span>
                    <div style="display: flex; align-items: baseline; gap: 12px; margin-top: 20px;">
                        <span id="temp-main" style="font-size: clamp(4rem, 10vw, 7rem); font-weight: 100; letter-spacing: -8px; line-height: 0.7; color: #fff;">--</span>
                        <div>
                            <div id="feels-like" style="font-size: 20px; font-weight: 900; color: #00ffaa;">--°</div>
                            <div style="font-size: 10px; font-weight: 900; opacity: 0.6; letter-spacing: 1px; color: #fff;">FEELS_LIKE</div>
                        </div>
                    </div>
                    <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; color: #fff;">
                        <div><div class="bold-label">WIND</div><div id="wind-val" class="mono" style="font-size: 14px; font-weight: 700;">-- KM/H</div></div>
                        <div><div class="bold-label">HUMIDITY</div><div id="hum-val" class="mono" style="font-size: 14px; font-weight: 700;">--%</div></div>
                    </div>
                </div>

                <div class="pro-panel-heavy chart-panel" style="flex: 2;">
                    <span class="bold-label">7-DAY THERMAL VELOCITY</span>
                    <div id="chart-grid" style="display: flex; align-items: flex-end; justify-content: space-around; height: 120px; margin-top: 30px; gap: 12px;"></div>
                </div>

                <div class="pro-panel-heavy" style="flex: 1.2; text-align: center;">
                    <span class="bold-label">AIR_PURITY</span>
                    <div style="position: relative; height: 140px; width: 140px; margin: 20px auto 0;">
                        <svg viewBox="0 0 36 36" style="transform: rotate(-90deg); filter: drop-shadow(0 0 8px rgba(0,255,170,0.3));">
                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"/>
                            <path id="aqi-ring" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#00ffaa" stroke-width="3" stroke-dasharray="0, 100" style="transition: stroke-dasharray 2s cubic-bezier(0.1, 1, 0.1, 1);"/>
                        </svg>
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff;">
                            <div id="aqi-val" style="font-size: 42px; font-weight: 300;">--</div>
                            <div id="aqi-tag" style="font-size: 10px; font-weight: 900; color: #00ffaa; letter-spacing: 1px;">SAFE</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&family=JetBrains+Mono:wght@700&display=swap');
    
    .glass-pill-ultra { 
        background: rgba(10, 10, 10, 0.25); 
        backdrop-filter: blur(40px); 
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        padding: 15px 30px; 
        border-radius: 25px; 
        display: flex; 
        align-items: center; 
        gap: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .pro-panel-heavy { 
        background: rgba(10, 10, 10, 0.25); 
        backdrop-filter: blur(40px); 
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.1); 
        border-radius: 40px; 
        padding: 35px; 
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .bold-label { font-size: 10px; font-weight: 900; letter-spacing: 2px; color: rgba(0, 255, 170, 0.7); text-transform: uppercase; }
    
    .radar-container { position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .radar-center { width: 10px; height: 10px; background: #00ffaa; border-radius: 50%; border: 2px solid #fff; z-index: 2; box-shadow: 0 0 15px #00ffaa; }
    .radar-wave { position: absolute; width: 100%; height: 100%; border: 1px solid #00ffaa; border-radius: 50%; opacity: 0; animation: radar-ping 3s infinite; }
    .radar-wave:nth-child(2) { animation-delay: 1s; }
    .radar-wave:nth-child(3) { animation-delay: 2s; }

    @keyframes radar-ping { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
    .radar-dot { width: 10px; height: 10px; background: #00ffaa; border-radius: 50%; animation: blink 1s infinite; box-shadow: 0 0 10px #00ffaa; }
    @keyframes blink { 50% { opacity: 0.3; } }
    
    .bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .bar-fill { width: 100%; background: linear-gradient(to top, #00ffaa, transparent); border-radius: 4px; transform: scaleY(0); transform-origin: bottom; transition: 1.5s cubic-bezier(0.1, 1, 0.1, 1); }
    .bar-day { font-size: 10px; font-weight: 900; color: #fff; opacity: 0.4; font-family: 'JetBrains Mono'; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* MOBILE ADAPTATION */
    @media (max-width: 768px) {
        #data-grid { flex-direction: column; align-items: stretch; overflow-y: auto; max-height: 60%; }
        .chart-panel { display: none; }
        #ui-overlay { justify-content: flex-start; gap: 20px; }
        #cmd-root { height: auto; min-height: 100vh; border-radius: 0; }
        .pro-panel-heavy { padding: 20px; }
    }
</style>

<script>
async function runCommand() {
    const lat = 19.4167, lon = 72.8167;
    try {
        const [w, a, g] = await Promise.all([
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&daily=temperature_2m_max&timezone=auto`).then(r => r.json()),
            fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&hourly=us_aqi`).then(r => r.json()),
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`).then(r => r.json())
        ]);

        document.getElementById('loc-name').innerText = (g.address.suburb || g.address.city || "NALA SOPARA").toUpperCase().replace(/\s(EAST|WEST)$/, "");
        document.getElementById('temp-main').innerText = Math.round(w.current.temperature_2m) + '°';
        document.getElementById('feels-like').innerText = Math.round(w.current.apparent_temperature) + '°';
        document.getElementById('wind-val').innerText = w.current.wind_speed_10m + ' KM/H';
        document.getElementById('hum-val').innerText = w.current.relative_humidity_2m + '%';

        const currentAQI = a.hourly.us_aqi[0];
        document.getElementById('aqi-val').innerText = currentAQI;
        document.getElementById('aqi-ring').style.strokeDasharray = `${currentAQI}, 100`;

        const chart = document.getElementById('chart-grid');
        const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        w.daily.temperature_2m_max.forEach((temp, i) => {
            const d = new Date(); d.setDate(d.getDate() + i);
            const wrap = document.createElement('div');
            wrap.className = 'bar-wrap';
            wrap.innerHTML = `<div class="bar-fill" style="height:${temp * 2.2}px"></div><div class="bar-day">${days[d.getDay()]}</div>`;
            chart.appendChild(wrap);
            setTimeout(() => { wrap.querySelector('.bar-fill').style.transform = 'scaleY(1)'; }, 800 + (i * 100));
        });

        const s = document.createElement('script');
        s.src = 'https://unpkg.com/maplibre-gl@5.0.1/dist/maplibre-gl.js';
        s.onload = () => {
            const map = new maplibregl.Map({
                container: 'map-target',
                style: { version: 8, sources: { 's': { type: 'raster', tiles: ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'], tileSize: 256 } }, layers: [{ id: 's', type: 'raster', source: 's' }] },
                center: [lon, lat], zoom: 4, pitch: 60, interactive: false
            });
            map.on('load', () => {
                const el = document.createElement('div');
                el.className = 'radar-container';
                el.innerHTML = '<div class="radar-wave"></div><div class="radar-wave"></div><div class="radar-center"></div>';
                new maplibregl.Marker(el).setLngLat([lon, lat]).addTo(map);
                setTimeout(() => map.flyTo({ center: [lon, lat], zoom: 16, speed: 0.4 }), 1000);
            });
        };
        document.head.appendChild(s);
    } catch (e) { console.log("System Link Offline"); }
}
runCommand();
</script>
