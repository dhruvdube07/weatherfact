<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherFact | Intelligence Terminal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="cmd-root" style="padding: 40px 20px;">
        
        <div class="glass-shard" style="height: 600px; position: relative; margin-bottom: 40px; overflow: hidden;">
            <div id="map-target" style="position: absolute; inset: 0; filter: brightness(0.65);"></div>
            <div style="position: relative; z-index: 10; display: flex; justify-content: space-between;">
                <div class="glass-pill-ultra" style="display: flex; align-items: center; gap: 15px;">
                    <span class="radar-dot"></span>
                    <div>
                        <div style="font-size: 10px; opacity: 0.6;">SATELLITE_UPLINK</div>
                        <div id="loc-name" style="font-weight: 900; color: #00ffaa; font-size: 1.5rem;">NALA SOPARA</div>
                    </div>
                </div>
                <div class="glass-pill-ultra" style="text-align: right;">
                    <div style="font-size: 10px; opacity: 0.6;">COORD_STAMP</div>
                    <div id="coord-val" style="font-family: 'JetBrains Mono';">19.4167 / 72.8167</div>
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px;">
            <div class="pro-card">
                <span style="color: #00b1ab; font-size: 12px; font-weight: 800;">THERMAL_DATA</span>
                <h1 id="temp-main" style="font-size: 5rem; margin: 20px 0;">--°</h1>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <small style="opacity: 0.5;">HUMIDITY</small>
                    <div id="hum-num" style="font-weight: 900;">--</div>
                </div>
            </div>

            <div class="pro-card">
                <span style="color: #00b1ab; font-size: 12px; font-weight: 800;">HYDRATION_LOGIC</span>
                <div style="height: 150px; display: flex; align-items: center; justify-content: center;">
                    <div class="orb" style="width: 100px; height: 100px; border-radius: 50%; border: 1px solid #00b1ab; position: relative; overflow: hidden;">
                        <div id="h2o-fill" class="wave"></div>
                    </div>
                </div>
                <div style="text-align: center; font-weight: 900;"><span id="h2o-num">--</span>L</div>
            </div>

            <div class="pro-card">
                <span style="color: #00b1ab; font-size: 12px; font-weight: 800;">ATMOS_DENSITY</span>
                <div style="height: 150px; background: rgba(255,255,255,0.05); border-radius: 20px; margin: 15px 0; position: relative; overflow: hidden;">
                    <div id="hum-bar" style="position: absolute; bottom: 0; width: 100%; background: #39b54a; transition: 1s;"></div>
                </div>
            </div>
        </div>

        <div class="glass-shard">
            <h2 style="font-family: 'Syne'; font-size: 2rem;">Local Ecology Scan</h2>
            <p style="font-family: 'JetBrains Mono'; opacity: 0.7;">PROXIMITY: VASAI-VIRAR WETLANDS</p>
            <div style="margin-top: 20px; padding: 20px; background: rgba(0, 255, 170, 0.05); border-radius: 15px;">
                <p>AN ESSENTIAL BIOLOGICAL CORRIDOR CONSISTING OF MANGROVE ECOSYSTEMS.</p>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
